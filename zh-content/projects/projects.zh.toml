# 每个 item 可用字段：title、subtitle、content（支持 markdown）、
# icon（16x16 图标）、image、link、badge、tags、featured、rotate
# link 指向英文页面时可以加 link_lang = "en"（告诉链接检查脚本这是有意跳转到英文页）

layout = "card"
flow = "stack"

