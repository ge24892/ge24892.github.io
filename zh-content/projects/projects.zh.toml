# 中文版项目列表（英文版是同一个目录下的 projects.toml）。
# 除 title 外所有字段都是可选的，不需要的 [[item]] 整块删掉即可。
#
# layout: "card" | "row" | "tile" | "gallery"
# flow:   "stack" | "inline" | "grid"
