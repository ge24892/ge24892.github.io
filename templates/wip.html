<!doctype html>
<html lang="{{ lang | default(value='en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Work in Progress</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #2f3030;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1c; color: #c1c1c1; }
    }
    main { text-align: center; padding: 2em; }
    h1 {
      margin: 0 0 .4em;
      font-size: 1.35em;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .pulse {
      display: inline-block;
      width: .5em; height: .5em;
      margin-left: .35em;
      border-radius: 50%;
      background: currentColor;
      opacity: .45;
      animation: wip 1.2s ease-in-out infinite alternate;
    }
    @keyframes wip { from { opacity: .15; } to { opacity: .6; } }
    p { margin: 0; font-size: .85em; opacity: .55; }
  </style>
</head>
<body>
  <main>
    <h1>Work in Progress<span class="pulse" aria-hidden="true"></span></h1>
    <p>check back soon</p>
  </main>
</body>
</html>
